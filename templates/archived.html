<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="/static/logo.jpg"><title>归档 — 妖姬马来手机号</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 min-h-screen">
  <nav class="sticky top-0 z-50 bg-white border-b border-gray-200 shadow-sm">
    <div class="max-w-xl mx-auto px-4 h-14 flex items-center gap-2">
      <a href="/" class="text-gray-400 hover:text-gray-600 text-lg mr-1">←</a>
      <img src="/static/logo.jpg" class="h-6 w-6 rounded-full object-cover">
      <h1 class="font-bold text-gray-800 text-base">已归档号码</h1>
    </div>
  </nav>

  <div class="max-w-xl mx-auto px-4 py-4">
    {% if items|length == 0 %}
      <div class="text-center py-12">
        <p class="text-3xl mb-2">📭</p>
        <p class="text-sm text-gray-400">没有已归档的号码</p>
      </div>
    {% endif %}

    <div class="space-y-2">
      {% for item in items %}
      <div class="rounded-xl border border-gray-200 bg-white p-4">
        <div class="flex items-center justify-between">
          <div>
            <p class="text-base font-bold text-gray-500">{{ item.phone_number }}</p>
            <div class="flex gap-2 mt-0.5">
              {% if item.provider %}<span class="text-[11px] bg-gray-100 text-gray-400 px-2 py-0.5 rounded">{{ item.provider }}</span>{% endif %}
              <span class="text-[11px] text-gray-300">最后更新: {{ item.updated_at[:10] }}</span>
            </div>
          </div>
        </div>
      </div>
      {% endfor %}
    </div>
  </div>
</body>
</html>
